<script>
'use strict';
/* Full re-port of the reference React app (Tailwind + lucide-react) into vanilla
   JS driven by google.script.run against a Google Sheets backend (Code.gs).
   Rendering strategy: build the whole #app innerHTML from DATA+UI on every
   change (cheap enough at this data size) using one delegated listener set,
   same pattern as React's re-render but without a vdom. */

/* ════════════════════════ constants & date helpers ════════════════════════ */
var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DOW = ["อา","จ","อ","พ","พฤ","ศ","ส"];
var TH_DOW = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
var TH_MON = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
var D = function(s){ return new Date(s+"T00:00:00"); };
var startOfDay = function(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
var TODAY = startOfDay(new Date());
var thaiDate = function(d){ return "วัน"+TH_DOW[d.getDay()]+"ที่ "+d.getDate()+" "+TH_MON[d.getMonth()]+" "+d.getFullYear(); };
var thaiShort = function(d){ return TH_DOW[d.getDay()].slice(0,2)+" "+d.getDate()+" "+TH_MON[d.getMonth()].slice(0,3); };
var weekOfMonth = function(d){ return Math.ceil((d.getDate()+new Date(d.getFullYear(),d.getMonth(),1).getDay())/7); };
var addDays = function(d,n){ return new Date(d.getTime()+n*86400000); };
var mondayOf = function(d){ var k=d.getDay(); return addDays(startOfDay(d), k===0?-6:1-k); };
var fmt = function(s){ if(!s) return ""; var d=D(s); return d.getDate()+" "+MON[d.getMonth()]; };
var fmtFull = function(s){ if(!s) return ""; var d=D(s); return d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear(); };
var diffDays = function(a,b){ return Math.round((b-a)/86400000); };
var iso = function(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
var baht = function(n){ return (n||0).toLocaleString("en-US"); };
var pctFn = function(a,b){ return b ? Math.round((a/b)*100) : 0; };
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

var APP_VERSION = "v1.0";
var CHANGELOG = [
  ["v1.0", "ย้ายระบบมาใช้ Google Sheets เป็นฐานข้อมูลผ่าน Google Apps Script — พอร์ตเต็มรูปแบบจากดีไซน์ React ต้นฉบับ (Template โครงการ, ลากสลับลำดับ Task, ย้ายงานทั้งหมดระหว่างคน, ค้นหาทั้งระบบ)"],
];

var STATUS = ["TODO","IN PROGRESS","REVIEW","BLOCKED","COMPLETED","CANCELLED"];
var PSTATUS = ["PLANNING","IN PROGRESS","ON HOLD","COMPLETED","CANCELLED"];
var PRIORITY = ["LOW","MEDIUM","HIGH","URGENT"];
var CATEGORIES = ["Marketing","Sales","Event","Service","Website","IT / System","CRM","Facility","HR","Accounting","Management","Other"];
var DEPARTMENTS = ["Management","Marketing","Sales","Service","Admin","Accounting"];
var ROLES = ["ADMIN","MANAGEMENT","PROJECT MANAGER","TEAM MEMBER"];

var statusStyle = {
  "TODO": "bg-slate-100 text-slate-600 border-slate-200",
  "IN PROGRESS": "bg-blue-50 text-blue-700 border-blue-200",
  "REVIEW": "bg-amber-50 text-amber-700 border-amber-200",
  "BLOCKED": "bg-rose-50 text-rose-700 border-rose-200",
  "COMPLETED": "bg-emerald-50 text-emerald-700 border-emerald-200",
  "CANCELLED": "bg-slate-100 text-slate-400 border-slate-200 line-through",
  "PLANNING": "bg-violet-50 text-violet-700 border-violet-200",
  "ON HOLD": "bg-orange-50 text-orange-700 border-orange-200",
};
var prioText = { LOW:"text-slate-600", MEDIUM:"text-sky-700", HIGH:"text-orange-700", URGENT:"text-rose-700" };
var prioStyle = {
  LOW: "bg-slate-100 text-slate-600", MEDIUM: "bg-sky-100 text-sky-700",
  HIGH: "bg-orange-100 text-orange-700", URGENT: "bg-rose-100 text-rose-700",
};
var barColor = {
  "COMPLETED":"bg-emerald-500","IN PROGRESS":"bg-blue-600","REVIEW":"bg-amber-500",
  "BLOCKED":"bg-rose-500","TODO":"bg-slate-300","CANCELLED":"bg-slate-200",
};
var healthLabel = { GREEN:"🟢 ON TRACK", YELLOW:"🟡 AT RISK", RED:"🔴 DELAYED" };
var healthStyle = { GREEN:"text-emerald-700 bg-emerald-50", YELLOW:"text-amber-700 bg-amber-50", RED:"text-rose-700 bg-rose-50" };

var isOpenT = function(t){ return ["COMPLETED","CANCELLED"].indexOf(t.status) < 0; };
var isOverdue = function(t){ return isOpenT(t) && diffDays(TODAY, D(t.due)) < 0; };
var overdueDays = function(t){ return -diffDays(TODAY, D(t.due)); };
var dueIn = function(t){ return diffDays(TODAY, D(t.due)); };

var NAV = [
  {id:"dashboard", label:"Dashboard", icon:"layout-dashboard"},
  {id:"today", label:"Today", icon:"sun"},
  {id:"weekly", label:"Weekly TODO", icon:"list-checks"},
  {id:"mytasks", label:"My Tasks", icon:"check-square"},
  {id:"projects", label:"Projects", icon:"folder-kanban"},
  {id:"timeline", label:"Timeline", icon:"gantt-chart-square"},
  {id:"calendar", label:"Calendar", icon:"calendar-days"},
  {id:"kanban", label:"Kanban", icon:"columns-3"},
  {id:"team", label:"Team", icon:"users"},
  {id:"reports", label:"Reports", icon:"bar-chart-3"},
  {id:"management", label:"Management", icon:"target"},
  {id:"settings", label:"Settings", icon:"settings"},
];
var BOTTOM_NAV = [["today","sun","Today"],["weekly","list-checks","สัปดาห์"],["mytasks","check-square","งานฉัน"],["kanban","columns-3","Kanban"],["dashboard","layout-dashboard","ภาพรวม"]];

var inputCls = "w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100";
var editCls = "w-full rounded-md border border-transparent bg-transparent px-1.5 py-1 hover:border-slate-300 hover:bg-slate-50 focus:border-blue-500 focus:bg-white focus:outline-none";
var miniSelect = "rounded-md border border-slate-200 bg-white px-1.5 py-0.5 text-xs text-slate-600 hover:border-slate-400 focus:border-blue-500 focus:outline-none";

/* ════════════════════════════════ state ════════════════════════════════ */
var DATA = { users:[], projects:[], tasks:[], milestones:[], activity:[], notifications:[], options:{templates:{}} };
var UI = {
  view: "dashboard", openProjectId: null, openTaskId: null, currentUserId: null,
  sidebar: false, showSearch: false, showBell: false, createMenu: false,
  modal: null, // {type:'project'|'task'|'milestone'|'note', projectId?, date?}
  confirmDel: null, dragTaskId: null, kanbanDragId: null,
  filters: {dept:"ทั้งหมด", category:"ทั้งหมด", status:"ทั้งหมด", priority:"ทั้งหมด", owner:"ทั้งหมด", health:"ทั้งหมด"},
  openMember: null, projSort: "priority", showPrioPanel: false, projectTab: "overview", ganttMode: "Day",
  timelineMode: "Week", kanbanScope: "ทุก Project", calMode: "Monthly",
  calCursor: new Date(TODAY.getFullYear(), TODAY.getMonth(), 1),
  weekOffset: 0, weekScope: "ทั้งทีม", commentDraft: "", reportRange: "This Month",
  searchQuery: "", projectForm: null, taskForm: null, milestoneForm: null, noteForm: null,
};
var BUSY = false;

/* ═══════════════════════════ derived lookups ═══════════════════════════ */
function userById(id){ return DATA.users.find(function(u){return u.id===id;}) || {name:"—", tone:"bg-slate-400", role:"", dept:""}; }
function projById(id){ return DATA.projects.find(function(p){return p.id===id;}); }
function taskOf(pid){ return DATA.tasks.filter(function(t){return t.projectId===pid;}); }
function autoProgress(p){
  if (p.manual != null) return p.manual;
  var ts = taskOf(p.id).filter(function(t){return t.status!=="CANCELLED";});
  if (!ts.length) return 0;
  return Math.round(ts.reduce(function(s,t){return s+t.progress;},0)/ts.length);
}
function health(p){
  if (p.status === "COMPLETED") return "GREEN";
  var ts = taskOf(p.id);
  var od = ts.filter(isOverdue).length;
  if (od >= 2 || diffDays(TODAY, D(p.due)) < 0) return "RED";
  var soon = ts.filter(function(t){return isOpenT(t) && dueIn(t) <= 3;}).length;
  if (od === 1 || soon >= 2) return "YELLOW";
  return "GREEN";
}
function taskCost(pid){ return taskOf(pid).reduce(function(a,t){return a+(t.actualCost||0);},0); }
function spentOf(p){ return p.actualCost || 0; }

/* ═══════════════════════════════ bootstrap ═══════════════════════════════ */
function boot(){
  google.script.run.withSuccessHandler(function(data){
    DATA = data;
    if (!UI.currentUserId && DATA.users.length) UI.currentUserId = DATA.users[0].id;
    render();
    setInterval(refreshQuiet, 45000);
    setInterval(function(){ var c=document.getElementById("liveClock"); if(c) c.textContent = clockLabel(); }, 30000);
  }).withFailureHandler(function(err){
    document.getElementById("app").innerHTML = "<div class='p-10'><h3 class='text-lg font-semibold'>โหลดข้อมูลไม่สำเร็จ</h3><p class='text-sm text-slate-500 mt-1'>"+esc(err.message||err)+"</p></div>";
  }).getAllData();
}
function refreshQuiet(){
  var ae = document.activeElement;
  if (UI.modal || (ae && ["INPUT","TEXTAREA","SELECT"].indexOf(ae.tagName) >= 0)) return;
  google.script.run.withSuccessHandler(function(data){ DATA = data; render(); }).withFailureHandler(function(){}).getAllData();
}
function refreshData(cb){
  setBusy(true);
  google.script.run.withSuccessHandler(function(data){
    DATA = data; setBusy(false); render(); if (cb) cb();
  }).withFailureHandler(function(err){
    setBusy(false); alert("เกิดข้อผิดพลาด: " + (err && err.message ? err.message : err)); render();
  }).getAllData();
}
function clockLabel(){
  var n = new Date();
  return String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
}
function setBusy(v){
  BUSY = v;
  // Only a cursor hint while a save is in flight — never a full render() here: that
  // would rebuild the whole DOM from still-stale DATA before the round-trip returns,
  // snapping the field you just edited back to its old value for a moment.
  document.body.style.cursor = v ? "progress" : "";
}
function call(fnName, args, after){
  setBusy(true);
  var run = google.script.run.withSuccessHandler(function(){ refreshData(after); })
    .withFailureHandler(function(err){ setBusy(false); alert("เกิดข้อผิดพลาด: " + (err && err.message ? err.message : err)); render(); });
  run[fnName].apply(run, args);
}

/* ════════════════════════════════ actions ════════════════════════════════ */
var ACTIONS = {
  go: function(d){ UI.view=d.view; UI.openProjectId=null; UI.sidebar=false; render(); },
  toggleSidebar: function(){ UI.sidebar = !UI.sidebar; render(); },
  closeSidebar: function(){ UI.sidebar = false; render(); },
  setCurrentUser: function(d){ UI.currentUserId=d.id; render(); },
  toggleBell: function(){ UI.showBell=!UI.showBell; UI.createMenu=false; render(); },
  toggleCreateMenu: function(){ UI.createMenu=!UI.createMenu; UI.showBell=false; render(); },
  markAllRead: function(){ call("markAllNotificationsRead", []); },
  dismissPopovers: function(){ if(UI.showBell||UI.createMenu){ UI.showBell=false; UI.createMenu=false; render(); } },
  openProject: function(d){ UI.openProjectId=d.id; UI.view="projects"; render(); },
  openTask: function(d){ UI.openTaskId=d.id; render(); },
  closeDrawer: function(){ UI.openTaskId=null; UI.commentDraft=""; render(); },
  closeProjectDetail: function(){ UI.openProjectId=null; render(); },
  stop: function(){},

  openCreateMenuItem: function(d){
    UI.createMenu=false;
    if (d.kind==="project") ACTIONS.openNewProject();
    else if (d.kind==="milestone") ACTIONS.openNewMilestone({});
    else if (d.kind==="note") ACTIONS.openNewNote();
    else ACTIONS.openNewTask({pid: UI.openProjectId});
  },
  openNewProject: function(){
    UI.projectForm = { name:"", category:"Event", dept:"Marketing", desc:"", ownerId: UI.currentUserId, priority:"MEDIUM", status:"PLANNING", start: iso(TODAY), due: iso(addDays(TODAY,14)), budget:0, tags:"", template:"ไม่ใช้ Template" };
    UI.modal = {type:"project"}; render();
  },
  openNewTask: function(d){
    var pid = (d&&d.pid) || UI.openProjectId || (DATA.projects[0] && DATA.projects[0].id);
    var me = userById(UI.currentUserId);
    UI.taskForm = { projectId: pid, name:"", ownerId: UI.currentUserId, dept: me.dept || "Marketing", status:"TODO", priority:"MEDIUM", start: (d&&d.date)||iso(TODAY), due: (d&&d.date)||iso(addDays(TODAY,3)), estCost:0, desc:"" };
    UI.modal = {type:"task"}; render();
  },
  openNewMilestone: function(d){
    var pid = (d&&d.pid) || UI.openProjectId || (DATA.projects[0] && DATA.projects[0].id);
    UI.milestoneForm = { projectId: pid, name:"", date: iso(addDays(TODAY,7)) };
    UI.modal = {type:"milestone"}; render();
  },
  openNewNote: function(){
    UI.noteForm = { projectId: UI.openProjectId || (DATA.projects[0] && DATA.projects[0].id), text:"" };
    UI.modal = {type:"note"}; render();
  },
  closeModal: function(){ UI.modal=null; render(); },
  openSearch: function(){
    UI.showSearch=true; UI.searchQuery=""; render();
    var el = document.getElementById("searchInputEl"); if (el) el.focus();
  },
  closeSearch: function(){ UI.showSearch=false; render(); },
  searchInput: function(d,ev){ UI.searchQuery = ev.target.value; renderSearchResultsOnly(); },
  searchGo: function(d){
    UI.showSearch=false;
    if (d.kind==="project") ACTIONS.openProject({id:d.id});
    else if (d.kind==="task") ACTIONS.openTask({id:d.id});
    render();
  },

  pfBind: function(d,ev){ UI.projectForm[d.field] = ev.target.value; },
  pfBindNum: function(d,ev){ UI.projectForm[d.field] = +ev.target.value || 0; },
  pfSetTemplate: function(d,ev){ UI.projectForm.template = ev.target.value; render(); },
  submitProject: function(){
    var f = UI.projectForm; if (!f.name.trim()) { alert("กรอกชื่อโครงการ"); return; }
    UI.modal=null;
    call("createProject", [f, f.template], function(){ UI.view="projects"; });
  },
  tfBind: function(d,ev){ UI.taskForm[d.field] = ev.target.value; },
  tfBindNum: function(d,ev){ UI.taskForm[d.field] = +ev.target.value || 0; },
  submitTask: function(){
    var f = UI.taskForm; if (!f.name.trim() || !f.projectId) { alert("กรอกชื่องานและเลือกโครงการ"); return; }
    UI.modal=null; call("createTask", [f]);
  },
  mfBind: function(d,ev){ UI.milestoneForm[d.field] = ev.target.value; },
  submitMilestone: function(){
    var f = UI.milestoneForm; if (!f.name.trim() || !f.projectId) { alert("กรอกชื่อ Milestone"); return; }
    UI.modal=null; call("createMilestone", [f, UI.currentUserId]);
  },
  nfBindProject: function(d,ev){ UI.noteForm.projectId = ev.target.value; },
  nfBindText: function(d,ev){ UI.noteForm.text = ev.target.value; },
  submitNote: function(){
    var f = UI.noteForm; if (!f.text.trim()) return;
    UI.modal=null; call("setProjectNote", [f.projectId, f.text, UI.currentUserId]);
  },

  toggleDone: function(d){
    var t = DATA.tasks.find(function(x){return x.id===d.id;});
    call("updateTask", [d.id, {status: t.status==="COMPLETED" ? "IN PROGRESS" : "COMPLETED"}]);
  },
  askDeleteTask: function(d){
    var t = DATA.tasks.find(function(x){return x.id===d.id;});
    UI.confirmDel = {kind:"task", id:t.id, name:t.name, label:"Task"}; render();
  },
  askDeleteProject: function(d){
    var p = DATA.projects.find(function(x){return x.id===d.id;});
    UI.confirmDel = {kind:"project", id:p.id, name:p.name, label:"โครงการ", note:"Task "+taskOf(p.id).length+" รายการ, Milestone และ Activity Log ทั้งหมดของโครงการนี้จะถูกลบไปด้วย"}; render();
  },
  askDeleteUser: function(d){
    var u = DATA.users.find(function(x){return x.id===d.id;});
    UI.confirmDel = {kind:"user", id:u.id, name:u.name, label:"สมาชิก", note:u.name+" ยังถืองานอยู่ "+DATA.tasks.filter(function(t){return t.ownerId===u.id;}).length+" รายการ — ควรย้ายงานให้คนอื่นก่อนลบ"}; render();
  },
  askDeleteMilestone: function(d){
    var m = DATA.milestones.find(function(x){return x.id===d.id;});
    UI.confirmDel = {kind:"milestone", id:m.id, name:m.name, label:"Milestone"}; render();
  },
  cancelDelete: function(){ UI.confirmDel=null; render(); },
  confirmDoDelete: function(){
    var c = UI.confirmDel; if (!c) return; UI.confirmDel=null;
    if (c.kind==="task") { if (UI.openTaskId===c.id) UI.openTaskId=null; call("deleteTask", [c.id]); }
    if (c.kind==="project") { if (UI.openProjectId===c.id) UI.openProjectId=null; call("deleteProject", [c.id]); }
    if (c.kind==="user") call("deleteUser", [c.id]);
    if (c.kind==="milestone") call("deleteMilestone", [c.id, UI.currentUserId]);
  },

  toggleSubtask: function(d){ call("toggleSubtask", [d.tid, d.sid]); },
  deleteSubtask: function(d){ call("deleteSubtask", [d.tid, d.sid]); },
  addSubtask: function(d, ev){
    if (ev.key !== "Enter" || !ev.target.value.trim()) return;
    var val = ev.target.value.trim(); ev.target.value="";
    call("addSubtask", [d.tid, val]);
  },
  sendComment: function(){
    var text = (UI.commentDraft||"").trim(); if (!text) return;
    var tid = UI.openTaskId; UI.commentDraft="";
    call("addComment", [tid, UI.currentUserId, text]);
  },
  commentInput: function(d,ev){ UI.commentDraft = ev.target.value; },
  commentKeydown: function(d,ev){ if (ev.key==="Enter" && UI.commentDraft.trim()) ACTIONS.sendComment(); },

  goWeekly: function(){ UI.view="weekly"; render(); },
  goProjects: function(){ UI.view="projects"; render(); },
  weekScope: function(d){ UI.weekScope=d.v; render(); },
  weekPrev: function(){ UI.weekOffset--; render(); },
  weekNext: function(){ UI.weekOffset++; render(); },
  weekThis: function(){ UI.weekOffset=0; render(); },
  weekJump: function(d){ UI.weekOffset = +d.i; render(); },

  setProjSort: function(d,ev){ UI.projSort = ev.target.value; render(); },
  togglePrioPanel: function(){ UI.showPrioPanel = !UI.showPrioPanel; render(); },
  setFilter: function(d,ev){ UI.filters[d.key] = ev.target.value; render(); },
  clearFilters: function(){ UI.filters = {dept:"ทั้งหมด",category:"ทั้งหมด",status:"ทั้งหมด",priority:"ทั้งหมด",owner:"ทั้งหมด",health:"ทั้งหมด"}; render(); },
  setProjectPriority: function(d,ev){ var v = ev ? ev.target.value : d.val; call("updateProject", [d.id, {priority:v}, UI.currentUserId, "เปลี่ยน Priority ของโครงการเป็น "+v]); },

  pdSetTab: function(d){ UI.projectTab = d.tab; render(); },
  pdAddTask: function(){ ACTIONS.openNewTask({pid: UI.openProjectId}); },
  pdAddMilestone: function(){ ACTIONS.openNewMilestone({pid: UI.openProjectId}); },
  pdDelete: function(){ ACTIONS.askDeleteProject({id: UI.openProjectId}); },
  pdToggleTeam: function(d){
    var p = projById(UI.openProjectId);
    if (d.uid === p.ownerId) return;
    call("toggleProjectTeam", [UI.openProjectId, d.uid]);
  },
  pdToggleMilestone: function(d){ call("toggleMilestone", [d.id]); },
  pdToggleManual: function(d,ev){
    var p = projById(UI.openProjectId);
    call("updateProject", [UI.openProjectId, {manual: ev.target.checked ? autoProgress(p) : null}]);
  },
  pdSetManual: function(d,ev){ call("updateProject", [UI.openProjectId, {manual: +ev.target.value}]); },
  pdUseTaskCost: function(){ call("updateProject", [UI.openProjectId, {actualCost: taskCost(UI.openProjectId)}, UI.currentUserId, "ดึงค่าใช้จ่ายจาก Task รวม ฿"+baht(taskCost(UI.openProjectId))]); },
  setGanttMode: function(d){ UI.ganttMode = d.mode; render(); },
  setTimelineMode: function(d){ UI.timelineMode = d.mode; render(); },
  sortProjectTasks: function(d,ev){
    var key = ev.target.value; ev.target.value = "";
    if (!key) return;
    call("sortProjectTasks", [UI.openProjectId, key, UI.currentUserId]);
  },

  calPrev: function(){ UI.calCursor = new Date(UI.calCursor.getFullYear(), UI.calCursor.getMonth()-1, 1); render(); },
  calNext: function(){ UI.calCursor = new Date(UI.calCursor.getFullYear(), UI.calCursor.getMonth()+1, 1); render(); },
  calMode: function(d){ UI.calMode = d.mode; render(); },

  setKanbanScope: function(d,ev){ UI.kanbanScope = ev.target.value; render(); },
  kanbanDragStart: function(d){ UI.kanbanDragId = d.id; },
  kanbanDropCol: function(d){
    if (!UI.kanbanDragId) return;
    call("updateTask", [UI.kanbanDragId, {status:d.status}]); UI.kanbanDragId=null;
  },
  kanbanDropCard: function(d){
    var id = UI.kanbanDragId; UI.kanbanDragId=null;
    if (!id || id === d.id) return;
    call("reorderTask", [id, d.id, false], function(){
      var t = DATA.tasks.find(function(x){return x.id===id;});
      if (t && t.status !== d.status) call("updateTask", [id, {status:d.status}]);
    });
  },

  moveTaskUp: function(d){ ACTIONS.moveTask(d, -1); },
  moveTaskDown: function(d){ ACTIONS.moveTask(d, 1); },
  moveTask: function(d, dir){
    var list = d.list || [];
    var i = list.indexOf(d.id); var j = i+dir;
    if (i<0 || j<0 || j>=list.length) return;
    call("reorderTask", [d.id, list[j], dir>0]);
  },
  rowDragStart: function(d){ UI.dragTaskId = d.id; },
  rowDrop: function(d){
    var id = UI.dragTaskId; UI.dragTaskId=null;
    if (!id || id===d.id) return;
    call("reorderTask", [id, d.id, false]);
  },

  addUser: function(){ call("createUser", []); },
  reassign: function(d,ev){
    var to = ev.target.value; ev.target.value = "";
    if (!to) return;
    call("reassignAll", [d.from, to]);
  },
  toggleMember: function(d){ UI.openMember = UI.openMember===d.id ? null : d.id; render(); },

  patchProject: function(d,ev){
    var patch = {}; patch[d.field] = ev.target.type==="number" ? (+ev.target.value||0) : ev.target.value;
    var msgMap = {category:"เปลี่ยน Category เป็น ", dept:"เปลี่ยนแผนกเป็น ", priority:"เปลี่ยน Priority ของโครงการเป็น ", status:"เปลี่ยนสถานะโครงการเป็น ", start:"เปลี่ยนวันเริ่มเป็น ", due:"เปลี่ยน Deadline เป็น ", budget:"ปรับ Budget เป็น ฿", actualCost:"ปรับค่าใช้จ่ายจริงเป็น ฿", name:"เปลี่ยนชื่อโครงการเป็น \""+ev.target.value+"\""};
    var msg = null;
    if (d.field==="name") msg = msgMap.name;
    else if (d.field==="budget"||d.field==="actualCost") msg = msgMap[d.field]+baht(patch[d.field]);
    else if (d.field==="due"||d.field==="start") msg = msgMap[d.field]+fmt(ev.target.value);
    else if (msgMap[d.field]) msg = msgMap[d.field]+ev.target.value;
    if (d.field === "ownerId") {
      var p = projById(UI.openProjectId);
      call("updateProject", [UI.openProjectId, {ownerId: ev.target.value, team: p.team.indexOf(ev.target.value)>=0 ? p.team : p.team.concat([ev.target.value])}, UI.currentUserId, "เปลี่ยน Owner เป็น "+userById(ev.target.value).name]);
      return;
    }
    if (d.field==="desc") msg = "แก้ไขรายละเอียดโครงการ";
    if (d.field==="note") msg = "แก้ไข Note ของโครงการ";
    if (d.field==="tags") { patch.tags = ev.target.value.split(",").map(function(s){return s.trim();}).filter(Boolean); msg = "แก้ไข Tag"; }
    call("updateProject", [UI.openProjectId, patch, UI.currentUserId, msg]);
  },
  patchTask: function(d,ev){
    var patch = {}; var val = ev.target.value;
    if (["progress","estCost","actualCost"].indexOf(d.field) >= 0) val = +val || 0;
    patch[d.field] = val;
    call("updateTask", [UI.openTaskId, patch]);
  },
  deleteInlineSubtask: function(d){
    var t = DATA.tasks.find(function(x){return x.id===UI.openTaskId;});
    call("updateTask", [UI.openTaskId, {subtasks: t.subtasks.filter(function(s){return s.id!==d.sid;})}]);
  },
  userField: function(d,ev){ var patch={}; patch[d.field]=ev.target.value; call("updateUser", [d.id, patch]); },
  drawerOwnerFromRow: function(d,ev){ call("updateTask", [d.id, {ownerId: ev.target.value}]); },

  reportRange: function(d,ev){ UI.reportRange = ev.target.value; render(); },
};

/* ══════════════════════════ event delegation ══════════════════════════ */
document.addEventListener("DOMContentLoaded", function(){
  boot();
  document.addEventListener("click", function(ev){
    var el = ev.target.closest("[data-act]");
    if (!el) return;
    var fn = ACTIONS[el.dataset.act];
    if (fn) { ev.preventDefault(); fn(JSON.parse(el.dataset.arg||"{}"), ev); }
  });
  document.addEventListener("change", function(ev){
    var el = ev.target.closest("[data-change]");
    if (el) { var fn = ACTIONS[el.dataset.change]; if (fn) fn(JSON.parse(el.dataset.arg||"{}"), ev); }
  });
  document.addEventListener("input", function(ev){
    var el = ev.target.closest("[data-input]");
    if (el) { var fn = ACTIONS[el.dataset.input]; if (fn) fn(JSON.parse(el.dataset.arg||"{}"), ev); }
  });
  document.addEventListener("keydown", function(ev){
    var el = ev.target.closest("[data-keydown]");
    if (el) { var fn = ACTIONS[el.dataset.keydown]; if (fn) fn(JSON.parse(el.dataset.arg||"{}"), ev); }
  });
  document.addEventListener("dragover", function(ev){ if (ev.target.closest("[data-dropzone],[data-droptask]")) ev.preventDefault(); });
  document.addEventListener("drop", function(ev){
    var col = ev.target.closest("[data-dropzone]");
    var card = ev.target.closest("[data-droptask]");
    if (card) { ev.preventDefault(); ev.stopPropagation(); ACTIONS.kanbanDropCard(JSON.parse(card.dataset.droptask)); return; }
    if (col) { ev.preventDefault(); ACTIONS.kanbanDropCol(JSON.parse(col.dataset.dropzone)); }
  });
  document.addEventListener("dragstart", function(ev){
    var k = ev.target.closest("[data-drag-kanban]");
    var r = ev.target.closest("[data-drag-row]");
    if (k) UI.kanbanDragId = k.dataset.dragKanban;
    if (r) UI.dragTaskId = r.dataset.dragRow;
  });
});

/* ═══════════════════════════════ Gantt (shared) ═══════════════════════════════ */
function gantt(rows, milestones, mode, onRowAct){
  if (!rows.length) return emptyMsg("ยังไม่มี Task ใน Timeline", "p-6 text-center text-sm text-slate-400");
  var starts = rows.map(function(r){return D(r.start).getTime();});
  var ends = rows.map(function(r){return D(r.due).getTime();});
  var min = addDays(new Date(Math.min.apply(null,starts)), -1);
  var max = addDays(new Date(Math.max.apply(null,ends)), 1);
  var total = diffDays(min,max)+1;
  var cols = [];
  if (mode==="Day") {
    for (var i=0;i<total;i++){ var d=addDays(min,i); cols.push({label:String(d.getDate()), sub:DOW[d.getDay()], span:1}); }
  } else if (mode==="Week") {
    var i=0;
    while (i<total){ var d=addDays(min,i); var span=Math.min(7-d.getDay(), total-i); cols.push({label:d.getDate()+" "+MON[d.getMonth()], sub:"สัปดาห์", span:span}); i+=span; }
  } else {
    var i=0;
    while (i<total){ var d=addDays(min,i); var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); var span=Math.min(last-d.getDate()+1, total-i); cols.push({label:MON[d.getMonth()]+" "+d.getFullYear(), sub:span+" วัน", span:span}); i+=span; }
  }
  var leftPct = function(s){ return (diffDays(min,D(s))/total)*100; };
  var widthPct = function(s,e){ return ((diffDays(D(s),D(e))+1)/total)*100; };
  var minW = mode==="Day" ? Math.max(760, total*38) : 760;
  var headCols = cols.map(function(c){ return '<div class="border-l border-slate-100 px-1 py-2 text-center" style="width:'+(c.span/total*100)+'%"><div class="truncate text-xs font-medium text-slate-700">'+esc(c.label)+'</div><div class="truncate text-xs text-slate-400">'+esc(c.sub)+'</div></div>'; }).join("");
  var body = rows.map(function(r){
    var od = r.overdue;
    return '<div class="flex items-center border-b border-slate-100 hover:bg-slate-50">'
      + '<button class="w-56 shrink-0 truncate px-3 py-2 text-left text-sm text-slate-700" '+onRowAct(r)+'>'+esc(r.name)+'</button>'
      + '<div class="relative h-9 flex-1"><div class="absolute top-2 h-5 rounded-md '+(od?"bg-rose-500":barColor[r.status]||"bg-blue-600")+' flex items-center px-2" style="left:'+leftPct(r.start)+'%;width:'+widthPct(r.start,r.due)+'%;min-width:18px" title="'+fmt(r.start)+' – '+fmt(r.due)+'"><span class="truncate text-xs font-medium text-white">'+(r.progress>0?r.progress+"%":"")+'</span></div></div></div>';
  }).join("");
  var msRows = (milestones||[]).map(function(m){
    return '<div class="flex items-center border-b border-slate-100 bg-slate-50"><div class="w-56 shrink-0 truncate px-3 py-2 text-sm font-medium text-slate-600">◆ '+esc(m.name)+'</div>'
      + '<div class="relative h-8 flex-1"><div class="absolute top-2 flex items-center" style="left:'+leftPct(m.date)+'%">'
      + '<span class="h-3 w-3 rotate-45 '+(m.done?"bg-emerald-500":"bg-slate-800")+'"></span><span class="ml-2 whitespace-nowrap text-xs text-slate-500">'+fmt(m.date)+'</span></div></div></div>';
  }).join("");
  return '<div class="overflow-x-auto"><div style="min-width:'+minW+'px">'
    + '<div class="flex border-b border-slate-200"><div class="w-56 shrink-0 px-3 py-2 text-xs font-semibold text-slate-500">Task</div><div class="relative flex flex-1">'+headCols+'</div></div>'
    + '<div class="relative">'+body+msRows+'</div></div>'
    + '<div class="flex flex-wrap gap-4 px-3 py-3 text-xs text-slate-500">'
    + '<span class="flex items-center gap-1"><i class="inline-block h-3 w-3 rounded bg-emerald-500"></i>Completed</span>'
    + '<span class="flex items-center gap-1"><i class="inline-block h-3 w-3 rounded bg-blue-600"></i>In Progress</span>'
    + '<span class="flex items-center gap-1"><i class="inline-block h-3 w-3 rounded bg-slate-300"></i>Upcoming</span>'
    + '<span class="flex items-center gap-1"><i class="inline-block h-3 w-3 rounded bg-rose-500"></i>Overdue</span>'
    + '<span class="flex items-center gap-1"><i class="inline-block h-3 w-3 rotate-45 bg-slate-800"></i>Milestone</span></div></div>';

/* ═══════════════════════════════ view dispatch ═══════════════════════════════ */
function renderView(current){
  switch (UI.view) {
    case "dashboard": return viewDashboard();
    case "today": return viewToday();
    case "weekly": return viewWeekly();
    case "mytasks": return viewMyTasks();
    case "projects": return current ? viewProjectDetail(current) : viewProjectsGrid();
    case "timeline": return viewTimeline();
    case "calendar": return viewCalendar();
    case "kanban": return viewKanban();
    case "team": return viewTeam();
    case "reports": return viewReports();
    case "management": return viewManagement();
    case "settings": return viewSettings();
    default: return "";
  }
}

/* ═══════════════════════════════ Dashboard ═══════════════════════════════ */
function viewDashboard(){
  var me = userById(UI.currentUserId);
  var open = DATA.tasks.filter(isOpenT);
  var statsToday = open.filter(function(t){return t.due===iso(TODAY);}).length;
  var statsOverdue = DATA.tasks.filter(isOverdue).length;
  var statsWeek = open.filter(function(t){return dueIn(t)>=0 && dueIn(t)<=7;}).length;

  var mon = mondayOf(TODAY), sun = addDays(mon,6);
  var wk = DATA.tasks.filter(function(t){ return D(t.due)>=mon && D(t.due)<=sun && t.status!=="CANCELLED"; });
  var wkDone = wk.filter(function(t){return t.status==="COMPLETED";}).length;

  var upcoming = DATA.tasks.filter(function(t){return isOpenT(t) && dueIn(t)>=0;}).sort(function(a,b){return D(a.due)-D(b.due);}).slice(0,6);

    + '<div class="grid grid-cols-2 gap-3 lg:grid-cols-4">'
    + stat("Active Projects", DATA.projects.filter(function(p){return p.status==="IN PROGRESS";}).length, "จากทั้งหมด "+DATA.projects.length+" โครงการ", "folder-kanban")
    + stat("Projects Completed", DATA.projects.filter(function(p){return p.status==="COMPLETED";}).length, "", "circle-check", "text-emerald-600", "bg-emerald-50")
    + stat("Projects Delayed", DATA.projects.filter(function(p){return health(p)==="RED" && p.status!=="COMPLETED";}).length, "ต้องการการช่วยเหลือ", "alert-triangle", "text-rose-600", "bg-rose-50")
    + stat("Tasks ทั้งหมด", DATA.tasks.length, "เสร็จแล้ว "+DATA.tasks.filter(function(t){return t.status==="COMPLETED";}).length, "check-square")
    + '</div>'
    + '<div class="grid grid-cols-2 gap-3 lg:grid-cols-4">'
    + stat("กำลังดำเนินการ", DATA.tasks.filter(function(t){return t.status==="IN PROGRESS";}).length, "", "clock", "text-blue-600", "bg-blue-50")
    + stat("เกิน Deadline", statsOverdue, "", "alert-triangle", "text-rose-600", "bg-rose-50")
    + stat("ต้องทำวันนี้", statsToday, "", "sun", "text-amber-600", "bg-amber-50")
    + stat("ครบกำหนดใน 7 วัน", statsWeek, "", "calendar-days")

    + card(

        + '<p class="text-xs text-slate-500">ต้องปิดจบ '+wk.length+' งาน · เสร็จแล้ว '+wkDone+' · เหลือ '+(wk.length-wkDone)+'</p></div>'
        + '<div class="w-40 flex-1 sm:w-64 sm:flex-none">'+bar(pctFn(wkDone,wk.length),"bg-emerald-500")+'</div>'
        + '<button class="rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-50" '+act("goWeekly")+'>เปิด Weekly TODO</button>'

    + '<div class="grid gap-4 lg:grid-cols-3">'
    + card(sectionTitle("Project Progress", '<button class="text-xs font-medium text-blue-600 hover:underline" '+act("goProjects")+'>ดูทั้งหมด</button>')

          }).join("") || emptyMsg("ยังไม่มีโครงการ")) + '</div>', "p-4 lg:col-span-2")
    + card(sectionTitle("Upcoming Deadline")

    + '<div class="space-y-4">'
    + card(sectionTitle("Project ที่รับผิดชอบ")

    + '</div></div></div>';
}

/* ═══════════════════════════════ Weekly ═══════════════════════════════ */
function viewWeekly(){
  var offset = UI.weekOffset;
  var mon = addDays(mondayOf(TODAY), offset*7), sun = addDays(mon,6);
  var days = []; for (var i=0;i<7;i++) days.push(addDays(mon,i));
  var inWeek = function(s){ var d=D(s); return d>=mon && d<=sun; };
  var pool = DATA.tasks.filter(function(t){ return (UI.weekScope==="ทั้งทีม"||t.ownerId===UI.currentUserId) && t.status!=="CANCELLED"; });
  var finish = pool.filter(function(t){return inWeek(t.due);});
  var startOnly = pool.filter(function(t){return inWeek(t.start) && !inWeek(t.due) && D(t.due)>sun;});
  var bothInWeek = finish.filter(function(t){return inWeek(t.start);});
  var carry = pool.filter(function(t){return isOpenT(t) && D(t.due)<mon;});
  var doneCount = finish.filter(function(t){return t.status==="COMPLETED";}).length;
  var msWeek = DATA.milestones.filter(function(m){return inWeek(m.date);});
  var label = offset===0?"สัปดาห์นี้":offset===1?"สัปดาห์หน้า":offset===-1?"สัปดาห์ที่แล้ว":("อีก "+offset+" สัปดาห์");
  var outlook = [0,1,2,3].map(function(i){
    var a=addDays(mondayOf(TODAY), i*7), b=addDays(a,6);
    var list = pool.filter(function(t){ var d=D(t.due); return d>=a && d<=b; });
    return {a:a,b:b,list:list, done:list.filter(function(t){return t.status==="COMPLETED";}).length};
  });

  var dayCards = days.map(function(d){
    var s = iso(d);
    var list = finish.filter(function(t){return t.due===s;});
    var starts = pool.filter(function(t){return t.start===s && t.due!==s;});
    var ms = msWeek.filter(function(m){return m.date===s;});
    var isToday = s===iso(TODAY), weekend = d.getDay()===0||d.getDay()===6;
    return card(
      '<div class="flex items-baseline justify-between"><p class="text-sm font-semibold text-slate-800">'+TH_DOW[d.getDay()]+'</p><p class="text-xs text-slate-500">'+d.getDate()+' '+MON[d.getMonth()]+'</p></div>'
      + (isToday ? '<p class="text-xs font-medium text-blue-600">วันนี้</p>' : '')
      + '<div class="mt-2 space-y-1.5">'
      + ms.map(function(m){ return '<div class="rounded-md bg-slate-800 px-2 py-1 text-xs font-medium text-white">◆ '+esc(m.name)+'</div>'; }).join("")
      + list.map(function(t){
          var od = isOverdue(t);
          return '<div class="rounded-lg border p-2 '+(t.status==="COMPLETED"?"border-emerald-200 bg-emerald-50":od?"border-rose-200 bg-rose-50":"border-slate-200 bg-white")+'">'
            + '<div class="flex items-start gap-2">'
            + '<button class="mt-0.5 grid h-4 w-4 shrink-0 place-items-center rounded border '+(t.status==="COMPLETED"?"border-emerald-500 bg-emerald-500 text-white":"border-slate-300 bg-white")+'" '+act("toggleDone",{id:t.id})+'>'+(t.status==="COMPLETED"?icon("circle-check","h-3 w-3"):"")+'</button>'
            + '<button class="min-w-0 flex-1 text-left" '+act("openTask",{id:t.id})+'><p class="text-xs leading-snug '+(t.status==="COMPLETED"?"text-slate-400 line-through":"text-slate-800")+'">'+esc(t.name)+'</p><p class="mt-0.5 truncate text-xs text-slate-400">'+esc((projById(t.projectId)||{}).name||"")+'</p></button>'
            + avatar(t.ownerId) + '</div></div>';
        }).join("")
      + starts.map(function(t){ return '<button class="flex w-full items-center gap-1.5 rounded-md bg-violet-50 px-2 py-1 text-left" '+act("openTask",{id:t.id})+'>'+icon("play-circle","h-3 w-3 shrink-0 text-violet-600")+'<span class="truncate text-xs text-violet-700">เริ่ม: '+esc(t.name)+'</span></button>'; }).join("")
      + (!list.length && !starts.length && !ms.length ? '<p class="py-2 text-xs text-slate-300">ไม่มีงานกำหนดส่ง</p>' : '')
      + '</div>'
    , "p-3 "+(isToday?"border-blue-500 bg-blue-50":weekend?"bg-slate-50":""));
  }).join("");

  return '<div class="space-y-4">'
    + '<div class="flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-xl font-semibold text-slate-900">Weekly TODO List</h2><p class="text-sm text-slate-500">งานที่ต้องเริ่มและต้องปิดให้จบภายในสัปดาห์</p></div>'
    + '<div class="flex flex-wrap items-center gap-2">'
    + '<div class="flex rounded-lg border border-slate-300 p-0.5">' + ["ทั้งทีม","เฉพาะฉัน"].map(function(s){
        return '<button class="rounded-md px-3 py-1 text-xs font-medium '+(UI.weekScope===s?"bg-slate-900 text-white":"text-slate-600")+'" '+act("weekScope",{v:s})+'>'+s+'</button>';
      }).join("") + '</div>'
    + '<div class="flex items-center gap-1"><button class="rounded-lg border border-slate-300 p-1.5 hover:bg-slate-50" '+act("weekPrev")+'>'+icon("chevron-left","h-4 w-4")+'</button>'
    + '<button class="rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-50" '+act("weekThis")+'>สัปดาห์นี้</button>'
    + '<button class="rounded-lg border border-slate-300 p-1.5 hover:bg-slate-50" '+act("weekNext")+'>'+icon("chevron-right","h-4 w-4")+'</button></div>'
    + '</div></div>'
    + card('<div class="flex flex-wrap items-center justify-between gap-3"><div><p class="text-xs text-slate-400">'+label+' · สัปดาห์ที่ '+weekOfMonth(mon)+' ของ'+TH_MON[mon.getMonth()]+'</p>'
        + '<p class="text-lg font-semibold text-slate-900">'+mon.getDate()+' '+TH_MON[mon.getMonth()]+' – '+sun.getDate()+' '+TH_MON[sun.getMonth()]+' '+sun.getFullYear()+'</p></div>'
        + '<div class="flex flex-wrap gap-4 text-center">' + [["ต้องปิดจบ",finish.length,"text-slate-900"],["เกิดและจบในสัปดาห์นี้",bothInWeek.length,"text-blue-600"],["เริ่มสัปดาห์นี้",startOnly.length,"text-violet-600"],["เสร็จแล้ว",doneCount,"text-emerald-600"],["ค้างยกมา",carry.length,"text-rose-600"]].map(function(x){
            return '<div><p class="text-xl font-semibold '+x[2]+'">'+x[1]+'</p><p class="text-xs text-slate-500">'+x[0]+'</p></div>';
          }).join("") + '</div></div>'
        + '<div class="mt-3"><div class="mb-1 flex justify-between text-xs text-slate-500"><span>ความคืบหน้าของสัปดาห์</span><span>'+pctFn(doneCount,finish.length)+'%</span></div>'+bar(pctFn(doneCount,finish.length),"bg-emerald-500","h-3")+'</div>', "p-4")
    + (carry.length ? card(sectionTitle("ค้างยกมาจากสัปดาห์ก่อน — ต้องเคลียร์ก่อน", chip(carry.length+" รายการ","border-rose-200 bg-rose-50 text-rose-700"))
        + '<div class="rounded-lg border border-slate-200">'+carry.map(function(t){return taskRowHtml(t);}).join("")+'</div>', "border-rose-200 p-4") : '')
    + '<div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">'+dayCards+'</div>'
    + '<div class="grid gap-4 lg:grid-cols-2">'
    + card(sectionTitle("งานที่เกิดและจบภายในสัปดาห์นี้", '<span class="text-xs text-slate-500">'+bothInWeek.length+' รายการ</span>')
        + '<div class="rounded-lg border border-slate-200">' + (bothInWeek.length ? bothInWeek.map(function(t){return taskRowHtml(t);}).join("") : emptyMsg("สัปดาห์นี้ไม่มีงานที่เริ่มและจบภายในสัปดาห์เดียว")) + '</div>'
        + '<div class="mt-4">'+sectionTitle("เริ่มสัปดาห์นี้ ต่อเนื่องสัปดาห์หน้า",'<span class="text-xs text-slate-500">'+startOnly.length+' รายการ</span>')
        + '<div class="rounded-lg border border-slate-200">' + (startOnly.length ? startOnly.map(function(t){return taskRowHtml(t);}).join("") : emptyMsg("ไม่มีงานที่เริ่มสัปดาห์นี้แล้วยาวข้ามสัปดาห์")) + '</div></div>', "p-4")
    + card(sectionTitle("แผน 4 สัปดาห์ข้างหน้า")
        + '<div class="space-y-3">' + outlook.map(function(w,i){
            return '<button class="block w-full text-left" '+act("weekJump",{i:i})+'>'
              + '<div class="mb-1 flex justify-between text-sm"><span class="'+(offset===i?"font-semibold text-blue-700":"text-slate-700")+'">'+(i===0?"สัปดาห์นี้":"สัปดาห์ +"+i)+' · '+w.a.getDate()+'–'+w.b.getDate()+' '+MON[w.b.getMonth()]+'</span><span class="text-slate-500">'+w.done+'/'+w.list.length+' งาน</span></div>'
              + bar(pctFn(w.done,w.list.length), w.list.length>8?"bg-amber-500":"bg-blue-600")
              + (w.list.length>8 ? '<p class="mt-1 text-xs text-amber-600">งานหนาแน่น พิจารณากระจายงานไปสัปดาห์อื่น</p>' : '') + '</button>';
          }).join("") + '</div>'
        + '<div class="mt-4">'+sectionTitle("Milestone ในสัปดาห์นี้")
        + (msWeek.length ? msWeek.map(function(m){
            return '<div class="mb-2 flex items-center gap-2">'+icon("flag","h-4 w-4 "+(m.done?"text-emerald-500":"text-slate-400"))+'<span class="flex-1 truncate text-sm text-slate-700">'+esc(m.name)+'</span><span class="text-xs text-slate-400">'+fmt(m.date)+'</span></div>';
          }).join("") : emptyMsg("ไม่มี Milestone ครบกำหนดในสัปดาห์นี้")) + '</div>', "p-4")
    + '</div></div>';
}

/* ═══════════════════════════════ My Tasks ═══════════════════════════════ */
function viewMyTasks(){
  var mine = DATA.tasks.filter(function(t){return t.ownerId===UI.currentUserId;});
  var groups = [
    ["TODAY", mine.filter(function(t){return isOpenT(t) && t.due===iso(TODAY);})],
    ["OVERDUE", mine.filter(isOverdue)],
    ["THIS WEEK", mine.filter(function(t){return isOpenT(t) && dueIn(t)>0 && dueIn(t)<=7;})],
    ["UPCOMING", mine.filter(function(t){return isOpenT(t) && dueIn(t)>7;})],
    ["COMPLETED", mine.filter(function(t){return t.status==="COMPLETED";})],
  ];
  return '<div class="space-y-5">'
    + '<div class="flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-xl font-semibold text-slate-900">My Tasks</h2><p class="text-sm text-slate-500">งานทั้งหมดของ '+esc(userById(UI.currentUserId).name)+' · '+mine.length+' รายการ</p></div>'
    + '<button class="flex items-center gap-1.5 rounded-lg bg-blue-600 px-3 py-2 text-sm font-medium text-white hover:bg-blue-700" '+act("openNewTask",{})+'>'+icon("plus","h-4 w-4")+'เพิ่ม Task</button></div>'
    + groups.map(function(g){
        var ids = g[1].map(function(t){return t.id;});
        return card(sectionTitle(g[0], '<span class="text-xs text-slate-500">'+g[1].length+'</span>')
          + '<div class="rounded-lg border border-slate-200">' + (g[1].length ? g[1].map(function(t){return taskRowHtml(t,{orderList:ids});}).join("") : emptyMsg("ไม่มีงานในกลุ่มนี้")) + '</div>', "p-4");
      }).join("")
    + '</div>';
}

/* ═══════════════════════════════ filters / projects grid ═══════════════════════════════ */
function filteredProjects(){
  return DATA.projects.filter(function(p){
    return (UI.filters.dept==="ทั้งหมด"||p.dept===UI.filters.dept)
      && (UI.filters.category==="ทั้งหมด"||p.category===UI.filters.category)
      && (UI.filters.status==="ทั้งหมด"||p.status===UI.filters.status)
      && (UI.filters.priority==="ทั้งหมด"||p.priority===UI.filters.priority)
      && (UI.filters.owner==="ทั้งหมด"||p.ownerId===UI.filters.owner)
      && (UI.filters.health==="ทั้งหมด"||health(p)===UI.filters.health);
  });
}
function filterBar(){
  return card('<span class="flex items-center gap-1 text-xs font-medium text-slate-500">'+icon("filter","h-3.5 w-3.5")+'Filter</span>'
    + filterSelect("dept", DEPARTMENTS) + filterSelect("category", CATEGORIES) + filterSelect("status", PSTATUS)
    + filterSelect("priority", PRIORITY) + filterSelect("health", ["GREEN","YELLOW","RED"])
    + filterSelectUsers()
    + '<button class="ml-auto text-xs text-slate-500 hover:text-slate-800" '+act("clearFilters")+'>ล้างตัวกรอง</button>'
  , "flex flex-wrap items-center gap-2 p-3");
}
function filterSelect(key, opts){
  var cur = UI.filters[key];
  return '<select class="rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-xs text-slate-700 focus:border-blue-500 focus:outline-none" '+chg("setFilter",{key:key})+'>'
    + '<option '+(cur==="ทั้งหมด"?"selected":"")+'>ทั้งหมด</option>' + opts.map(function(o){ return '<option '+(cur===o?"selected":"")+'>'+o+'</option>'; }).join("") + '</select>';
}
function filterSelectUsers(){
  var cur = UI.filters.owner;
  return '<select class="rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-xs text-slate-700 focus:border-blue-500 focus:outline-none" '+chg("setFilter",{key:"owner"})+'>'
    + '<option value="ทั้งหมด" '+(cur==="ทั้งหมด"?"selected":"")+'>ทั้งหมด</option>'
    + DATA.users.map(function(u){ return '<option value="'+u.id+'" '+(cur===u.id?"selected":"")+'>'+esc(u.name)+'</option>'; }).join("") + '</select>';
}
function projectCardHtml(p){
  var prog = autoProgress(p), h = health(p), ts = taskOf(p.id);
  return card(
    '<div class="flex items-start justify-between gap-2">'
    + '<div class="min-w-0 cursor-pointer" '+act("openProject",{id:p.id})+'><p class="text-xs text-slate-400">'+esc(p.id)+'</p><p class="truncate text-sm font-semibold text-slate-900">'+esc(p.name)+'</p></div>'
    + '<div class="flex shrink-0 items-center gap-1">'
    + '<select class="rounded-md border-0 px-1.5 py-1 text-xs font-medium focus:outline-none '+prioStyle[p.priority]+'" title="กำหนด Priority" '+chg("setProjectPriority",{id:p.id})+'>'
    + PRIORITY.map(function(x){return '<option value="'+x+'" '+(p.priority===x?"selected":"")+'>'+x+'</option>';}).join("") + '</select>'
    + '<button class="rounded-md p-1 text-slate-300 hover:bg-rose-50 hover:text-rose-600" '+act("askDeleteProject",{id:p.id})+'>'+icon("trash-2","h-3.5 w-3.5")+'</button>'
    + '</div></div>'
    + '<div class="cursor-pointer" '+act("openProject",{id:p.id})+'>'
    + '<div class="mt-2 flex flex-wrap items-center gap-1.5">' + chip(p.category,"border-slate-200 bg-slate-50 text-slate-600") + chip(p.status, statusStyle[p.status]) + chip(healthLabel[h], "border-transparent "+healthStyle[h]) + '</div>'
    + '<div class="mt-3"><div class="mb-1 flex justify-between text-xs text-slate-500"><span>Progress</span><span class="font-medium text-slate-700">'+prog+'%</span></div>' + bar(prog, h==="RED"?"bg-rose-500":h==="YELLOW"?"bg-amber-500":"bg-blue-600") + '</div>'
    + '<div class="mt-3 flex items-center justify-between"><div class="flex -space-x-1.5">' + p.team.slice(0,4).map(function(u){return avatar(u);}).join("") + '</div>'
    + '<div class="text-right text-xs"><p class="text-slate-400">Deadline</p><p class="font-medium '+(diffDays(TODAY,D(p.due))<0 && p.status!=="COMPLETED"?"text-rose-600":"text-slate-700")+'">'+fmt(p.due)+'</p></div></div>'
    + '<p class="mt-2 text-xs text-slate-400">'+ts.filter(function(t){return t.status==="COMPLETED";}).length+'/'+ts.length+' Task เสร็จแล้ว · Owner '+esc(userById(p.ownerId).name)+'</p></div>'
  , "h-full p-4 hover:border-blue-300 hover:shadow-sm");
}
function viewProjectsGrid(){
  var filtered = filteredProjects();
  var PRIO_ORDER = {URGENT:0,HIGH:1,MEDIUM:2,LOW:3};
  var sorted = filtered.slice().sort(function(a,b){
    if (UI.projSort==="priority") return (PRIO_ORDER[a.priority]-PRIO_ORDER[b.priority]) || (D(a.due)-D(b.due));
    if (UI.projSort==="due") return D(a.due)-D(b.due);
    if (UI.projSort==="progress") return autoProgress(b)-autoProgress(a);
    return a.name.localeCompare(b.name,"th");
  });
  var prioPanel = UI.showPrioPanel ? card(sectionTitle("กำหนด Priority ของแต่ละโครงการ", '<button class="text-xs text-slate-500 hover:text-slate-800" '+act("togglePrioPanel")+'>ปิด</button>')
    + '<div class="space-y-2">' + DATA.projects.map(function(p){
        return '<div class="flex flex-wrap items-center gap-3 rounded-lg border border-slate-200 p-3"><div class="min-w-0 flex-1"><p class="truncate text-sm font-medium text-slate-800">'+esc(p.name)+'</p>'
          + '<p class="text-xs text-slate-400">'+p.id+' · '+p.category+' · Deadline '+fmt(p.due)+' · '+healthLabel[health(p)]+'</p></div>'
          + '<div class="flex rounded-lg border border-slate-200 p-0.5">' + PRIORITY.map(function(x){
              return '<button class="rounded-md px-2.5 py-1 text-xs font-medium '+(p.priority===x?prioStyle[x]+" ring-1 ring-slate-300":"text-slate-500 hover:bg-slate-50")+'" '+act("setProjectPriority",{id:p.id, val:x})+'>'+x+'</button>';
            }).join("") + '</div></div>';
      }).join("") + '</div>'
    + '<p class="mt-3 text-xs text-slate-500">URGENT = ต้องจัดการทันที · HIGH = สำคัญต่อเป้าหมายหลัก · MEDIUM = ตามแผนปกติ · LOW = ทำเมื่อมีเวลาว่าง</p>', "p-4") : "";
  return '<div class="space-y-4">'
    + '<div class="flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-xl font-semibold text-slate-900">Projects</h2><p class="text-sm text-slate-500">'+filtered.length+' โครงการ</p></div>'
    + '<div class="flex flex-wrap items-center gap-2">'
    + '<select class="rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-700" '+chg("setProjSort")+'>'
    + [["priority","เรียงตาม Priority"],["due","เรียงตาม Deadline"],["progress","เรียงตาม Progress"],["name","เรียงตามชื่อ"]].map(function(o){return '<option value="'+o[0]+'" '+(UI.projSort===o[0]?"selected":"")+'>'+o[1]+'</option>';}).join("")
    + '</select>'
    + '<button class="flex items-center gap-1.5 rounded-lg border px-3 py-2 text-sm font-medium '+(UI.showPrioPanel?"border-blue-500 bg-blue-50 text-blue-700":"border-slate-300 text-slate-700 hover:bg-slate-50")+'" '+act("togglePrioPanel")+'>'+icon("flag","h-4 w-4")+'กำหนด Priority</button>'
    + '<button class="flex items-center gap-1.5 rounded-lg bg-blue-600 px-3 py-2 text-sm font-medium text-white hover:bg-blue-700" '+act("openNewProject")+'>'+icon("plus","h-4 w-4")+'สร้าง Project</button>'
    + '</div></div>'
    + prioPanel + filterBar()
    + (sorted.length ? '<div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">'+sorted.map(projectCardHtml).join("")+'</div>' : card(emptyMsg("ไม่พบโครงการที่ตรงกับตัวกรอง ลองล้างตัวกรองหรือสร้างโครงการใหม่","text-sm text-slate-500"), "p-10 text-center"))
    + '</div>';
}

/* ═══════════════════════════════ Project detail ═══════════════════════════════ */
function viewProjectDetail(p){
  var h = health(p), ts = taskOf(p.id), ms = DATA.milestones.filter(function(m){return m.projectId===p.id;});
  var prog = autoProgress(p), left = diffDays(TODAY, D(p.due));
  var acts = DATA.activity.filter(function(a){return a.projectId===p.id;});
  var spent = spentOf(p);
  var TABS = [["overview","ภาพรวม"],["tasks","Task ("+ts.length+")"],["timeline","Timeline"],["milestone","Milestone ("+ms.length+")"],["activity","Activity"],["budget","Budget"]];
  var tab = UI.projectTab;

  var head = card(
    '<div class="flex flex-wrap items-start justify-between gap-3">'
    + '<div class="min-w-0 flex-1">'
    + '<div class="flex flex-wrap items-center gap-2"><span class="text-xs text-slate-400">'+p.id+'</span>'
    + selectHtml(CATEGORIES, p.category, "patchProject", {field:"category"}, miniSelect)
    + selectHtml(DEPARTMENTS, p.dept, "patchProject", {field:"dept"}, miniSelect) + '</div>'
    + '<input class="'+editCls+' -ml-1.5 mt-1 text-xl font-semibold text-slate-900" value="'+esc(p.name)+'" placeholder="ชื่อโครงการ" '+chg("patchProject",{field:"name"})+'>'
    + '<textarea class="'+editCls+' -ml-1.5 max-w-2xl text-sm text-slate-500" rows="2" placeholder="รายละเอียดโครงการ" '+chg("patchProject",{field:"desc"})+'>'+esc(p.desc)+'</textarea>'
    + '<div class="mt-2 flex flex-wrap items-center gap-1.5">' + chip(p.status, statusStyle[p.status]) + chip(p.priority,"border-transparent "+prioStyle[p.priority]) + chip(healthLabel[h],"border-transparent "+healthStyle[h])
    + p.tags.map(function(t){ return chip("#"+esc(t), "border-slate-200 bg-slate-50 text-slate-500"); }).join("")
    + '<input class="'+editCls+' w-28 text-xs text-slate-500" placeholder="+ tag" value="'+esc(p.tags.join(", "))+'" '+chg("patchProject",{field:"tags"})+'></div></div>'
    + '<div class="flex flex-wrap items-center gap-2">'
    + '<select class="rounded-lg border border-slate-300 px-2 py-2 text-sm font-medium focus:border-blue-500 focus:outline-none '+prioText[p.priority]+'" title="Priority ของโครงการ" '+chg("patchProject",{field:"priority"})+'>' + PRIORITY.map(function(x){return '<option value="'+x+'" '+(p.priority===x?"selected":"")+'>Priority: '+x+'</option>';}).join("") + '</select>'
    + '<select class="rounded-lg border border-slate-300 px-2 py-2 text-sm font-medium text-slate-700 focus:border-blue-500 focus:outline-none" '+chg("patchProject",{field:"status"})+'>' + PSTATUS.map(function(x){return '<option value="'+x+'" '+(p.status===x?"selected":"")+'>'+x+'</option>';}).join("") + '</select>'
    + '<button class="rounded-lg bg-blue-600 px-3 py-2 text-sm font-medium text-white hover:bg-blue-700" '+act("pdAddTask")+'>+ Task</button>'
    + '<button class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50" '+act("pdAddMilestone")+'>+ Milestone</button>'
    + '<button class="rounded-lg border border-rose-200 p-2 text-rose-600 hover:bg-rose-50" title="ลบโครงการ" '+act("pdDelete")+'>'+icon("trash-2","h-4 w-4")+'</button>'
    + '</div></div>'
    + '<div class="mt-4 grid grid-cols-2 gap-4 border-t border-slate-100 pt-4 sm:grid-cols-3 lg:grid-cols-6">'
    + '<div><p class="text-xs text-slate-400">Owner</p>' + selectHtml(DATA.users, p.ownerId, "patchProject", {field:"ownerId"}, editCls+" -ml-1.5 text-sm font-semibold text-slate-900") + '</div>'
    + '<div><p class="text-xs text-slate-400">Start</p><input type="date" class="'+editCls+' -ml-1.5 text-sm font-semibold text-slate-900" value="'+p.start+'" '+chg("patchProject",{field:"start"})+'></div>'
    + '<div><p class="text-xs text-slate-400">Deadline</p><input type="date" class="'+editCls+' -ml-1.5 text-sm font-semibold '+(left<0?"text-rose-600":"text-slate-900")+'" value="'+p.due+'" '+chg("patchProject",{field:"due"})+'></div>'
    + '<div><p class="text-xs text-slate-400">เหลือ</p><p class="px-1.5 py-1 text-sm font-semibold '+(left<0?"text-rose-600":"text-slate-900")+'">'+(left>=0?left+" Days":"เกิน "+(-left)+" วัน")+'</p></div>'
    + '<div><p class="text-xs text-slate-400">Budget (฿)</p><input type="number" class="'+editCls+' -ml-1.5 text-sm font-semibold text-slate-900" value="'+p.budget+'" '+chg("patchProject",{field:"budget"})+'></div>'
    + '<div><p class="text-xs text-slate-400">Used (฿)</p><input type="number" class="'+editCls+' -ml-1.5 text-sm font-semibold text-slate-900" value="'+p.actualCost+'" '+chg("patchProject",{field:"actualCost"})+'>'
    + (taskCost(p.id)!==p.actualCost ? '<button class="ml-1.5 text-xs text-blue-600 hover:underline" '+act("pdUseTaskCost")+'>ใช้ยอดจาก Task ฿'+baht(taskCost(p.id))+'</button>' : '') + '</div>'
    + '</div>'
    + '<div class="mt-4"><div class="mb-1 flex items-center justify-between text-xs text-slate-500"><span>Progress · คำนวณจาก Task '+ts.filter(function(t){return t.status==="COMPLETED";}).length+'/'+ts.length+' เสร็จ</span><span class="font-semibold text-slate-800">'+prog+'%</span></div>'
    + bar(prog, h==="RED"?"bg-rose-500":h==="YELLOW"?"bg-amber-500":"bg-blue-600", "h-3")
    + '<div class="mt-2 flex items-center gap-2"><label class="flex items-center gap-1.5 text-xs text-slate-500"><input type="checkbox" class="h-3.5 w-3.5 accent-blue-600" '+(p.manual!=null?"checked":"")+' '+chg("pdToggleManual")+'>กำหนด Progress เอง</label>'
    + (p.manual!=null ? '<input type="range" min="0" max="100" step="5" value="'+p.manual+'" class="w-40 accent-blue-600" '+chg("pdSetManual")+'>' : '') + '</div></div>'
  , "p-5");

  var tabsHtml = '<div class="flex gap-1 overflow-x-auto border-b border-slate-200">' + TABS.map(function(t){
    return '<button class="whitespace-nowrap border-b-2 px-3 py-2 text-sm font-medium '+(tab===t[0]?"border-blue-600 text-blue-700":"border-transparent text-slate-500 hover:text-slate-800")+'" '+act("pdSetTab",{tab:t[0]})+'>'+t[1]+'</button>';
  }).join("") + '</div>';

  var body = "";
  if (tab==="overview") body = pdOverview(p,ts,ms);
  else if (tab==="tasks") body = pdTasks(p,ts);
  else if (tab==="timeline") body = card('<div class="flex items-center justify-between border-b border-slate-200 px-4 py-3"><h3 class="text-sm font-semibold text-slate-900">Gantt Chart</h3>'+ganttModeSwitch()+'</div>'
      + gantt(ts.map(function(t){return Object.assign({},t,{overdue:isOverdue(t)});}), ms, UI.ganttMode, function(r){return act("openTask",{id:r.id});}));
  else if (tab==="milestone") body = pdMilestones(p,ms);
  else if (tab==="activity") body = pdActivity(acts);
  else if (tab==="budget") body = pdBudget(p,ts,spent);

  return '<div class="space-y-4">'
    + '<button class="flex items-center gap-1 text-sm text-slate-500 hover:text-slate-800" '+act("closeProjectDetail")+'>'+icon("arrow-left","h-4 w-4")+'กลับไปหน้า Projects</button>'
    + head + tabsHtml + body + '</div>';
}
function ganttModeSwitch(){
  return '<div class="flex rounded-lg border border-slate-300 p-0.5">' + ["Day","Week","Month"].map(function(m){
    return '<button class="rounded-md px-3 py-1 text-xs font-medium '+(UI.ganttMode===m?"bg-slate-900 text-white":"text-slate-600")+'" '+act("setGanttMode",{mode:m})+'>'+m+'</button>';
  }).join("") + '</div>';
}
function pdOverview(p, ts, ms){
  return '<div class="grid gap-4 lg:grid-cols-3">'
    + card(sectionTitle("Task ล่าสุด") + '<div class="rounded-lg border border-slate-200">' + (ts.length ? ts.slice(0,6).map(function(t){return taskRowHtml(t,{hideProject:true});}).join("") : emptyMsg("ยังไม่มี Task")) + '</div>', "p-4 lg:col-span-2")
    + '<div class="space-y-4">'
    + card(sectionTitle("ทีมงาน", '<span class="text-xs text-slate-400">กดชื่อเพื่อเพิ่ม/ออกจากทีม</span>')
        + '<div class="mb-3 flex flex-wrap gap-1.5">' + DATA.users.map(function(u){
            var inTeam = p.team.indexOf(u.id)>=0;
            return '<button '+(u.id===p.ownerId?"disabled":"")+' class="rounded-md border px-2 py-1 text-xs font-medium '+(inTeam?"border-blue-200 bg-blue-50 text-blue-700":"border-slate-200 text-slate-500 hover:bg-slate-50")+(u.id===p.ownerId?" opacity-60":"")+'" '+act("pdToggleTeam",{uid:u.id})+'>'+esc(u.name)+(u.id===p.ownerId?" (Owner)":"")+'</button>';
          }).join("") + '</div>'
        + '<div class="space-y-2">' + p.team.map(function(u){
            var n = ts.filter(function(t){return t.ownerId===u;});
            return '<div class="flex items-center gap-2">'+avatar(u,"md")+'<div class="min-w-0 flex-1"><p class="text-sm text-slate-800">'+esc(userById(u).name)+'</p><p class="text-xs text-slate-400">'+n.length+' tasks · '+n.filter(function(t){return t.status==="COMPLETED";}).length+' เสร็จ</p></div></div>';
          }).join("") + '</div>', "p-4")
    + card(sectionTitle("Milestone ถัดไป")
        + (ms.filter(function(m){return !m.done;}).slice(0,3).map(function(m){ return '<div class="mb-2 flex items-center gap-2">'+icon("flag","h-4 w-4 text-slate-400")+'<span class="flex-1 truncate text-sm text-slate-700">'+esc(m.name)+'</span><span class="text-xs text-slate-400">'+fmt(m.date)+'</span></div>'; }).join("") || emptyMsg("ยังไม่มี Milestone ที่ค้าง")), "p-4")
    + card(sectionTitle("Note") + '<textarea class="'+editCls+' -ml-1.5 text-sm text-slate-600" rows="3" placeholder="บันทึกสิ่งที่ต้องจำเกี่ยวกับโครงการนี้" '+chg("patchProject",{field:"note"})+'>'+esc(p.note||"")+'</textarea>', "p-4")
    + '</div></div>';
}
function pdTasks(p, ts){
  var ids = ts.map(function(t){return t.id;});
  return card(sectionTitle("Task ทั้งหมด", '<div class="flex items-center gap-2">'
      + '<select class="rounded-lg border border-slate-300 px-2 py-1 text-xs text-slate-600" '+chg("sortProjectTasks")+'><option value="">จัดเรียงอัตโนมัติ…</option><option value="start">ตามวันเริ่ม</option><option value="due">ตามวันครบกำหนด</option><option value="priority">ตาม Priority</option></select>'
      + '<button class="text-xs font-medium text-blue-600 hover:underline" '+act("pdAddTask")+'>+ Quick Add Task</button></div>')
    + '<p class="mb-2 flex items-center gap-1 text-xs text-slate-400">'+icon("arrow-down-up","h-3.5 w-3.5")+'ลากแถวเพื่อสลับลำดับ หรือกดลูกศรขึ้น-ลง · ลำดับนี้จะใช้กับ Gantt Chart ด้วย</p>'
    + '<div class="rounded-lg border border-slate-200">' + (ts.length ? ts.map(function(t){return taskRowHtml(t,{hideProject:true, orderList:ids});}).join("") : emptyMsg("ยังไม่มี Task เริ่มจากการเพิ่ม Task แรก")) + '</div>'
  , "p-4");
}
function pdMilestones(p, ms){
  return card(sectionTitle("Milestone", '<button class="text-xs font-medium text-blue-600 hover:underline" '+act("pdAddMilestone")+'>+ Milestone</button>')
    + (ms.length ? ms.map(function(m,i){
        return '<div class="flex gap-3"><div class="flex flex-col items-center">'
          + '<button class="grid h-6 w-6 place-items-center rounded-full border-2 '+(m.done?"border-emerald-500 bg-emerald-500 text-white":"border-slate-300 bg-white")+'" '+act("pdToggleMilestone",{id:m.id})+'>'+icon("flag","h-3 w-3")+'</button>'
          + (i<ms.length-1 ? '<span class="w-0.5 flex-1 bg-slate-200"></span>' : '') + '</div>'
          + '<div class="flex flex-1 items-start justify-between gap-2 pb-5"><div><p class="text-sm font-medium '+(m.done?"text-slate-400 line-through":"text-slate-800")+'">Milestone '+(i+1)+' · '+esc(m.name)+'</p>'
          + '<p class="text-xs text-slate-400">'+fmtFull(m.date)+(!m.done && diffDays(TODAY,D(m.date))>=0 ? (' · อีก '+diffDays(TODAY,D(m.date))+' วัน') : '')+'</p></div>'
          + '<button class="rounded-md p-1 text-slate-300 hover:bg-rose-50 hover:text-rose-600" '+act("askDeleteMilestone",{id:m.id})+'>'+icon("trash-2","h-4 w-4")+'</button></div></div>';
      }).join("") : emptyMsg("ยังไม่มี Milestone")), "p-4");
}
function pdActivity(acts){
  return card(sectionTitle("Activity Log")
    + '<div class="space-y-3">' + (acts.length ? acts.map(function(a){
        var u = userById(a.userId);
        return '<div class="flex gap-3">'+avatar(a.userId,"md")+'<div><p class="text-sm text-slate-800"><span class="font-medium">'+esc(u.name)+'</span> '+esc(a.text)+'</p><p class="text-xs text-slate-400">'+esc(a.at)+'</p></div></div>';
      }).join("") : emptyMsg("ยังไม่มีการเปลี่ยนแปลงในโครงการนี้")) + '</div>', "p-4");
}
function pdBudget(p, ts, spent){
  var usedPct = pctFn(spent, p.budget);
  return '<div class="grid gap-4 lg:grid-cols-3">'
    + card(sectionTitle("Budget vs Actual")
        + '<div class="grid grid-cols-2 gap-4 sm:grid-cols-4">'
        + '<div><p class="text-xs text-slate-400">Budget</p><p class="text-lg font-semibold text-slate-900">฿'+baht(p.budget)+'</p></div>'

/* ═══════════════════════════════ Calendar ═══════════════════════════════ */
function eventsOn(date){
  var s = iso(date);
  var out = [];
  DATA.projects.filter(function(p){return p.start===s;}).forEach(function(p){ out.push({label:"เริ่ม: "+p.name, tone:"bg-violet-100 text-violet-700", pid:p.id}); });
  DATA.projects.filter(function(p){return p.due===s;}).forEach(function(p){ out.push({label:"ส่ง: "+p.name, tone:"bg-rose-100 text-rose-700", pid:p.id}); });
  DATA.milestones.filter(function(x){return x.date===s;}).forEach(function(x){ out.push({label:"◆ "+x.name, tone:"bg-slate-200 text-slate-700"}); });
  DATA.tasks.filter(function(t){return t.due===s;}).forEach(function(t){ out.push({label:t.name, tone: t.status==="COMPLETED"?"bg-emerald-100 text-emerald-700":"bg-blue-100 text-blue-700", tid:t.id}); });
  return out;
}
function eventBtn(e, extraCls){
  var a = e.tid ? act("openTask",{id:e.tid}) : e.pid ? act("openProject",{id:e.pid}) : act("stop");
  return '<button class="'+(extraCls||"block w-full truncate rounded px-1 py-0.5 text-left text-xs")+' '+e.tone+'" '+a+'>'+esc(e.label)+'</button>';
}
function viewCalendar(){
  var y = UI.calCursor.getFullYear(), m = UI.calCursor.getMonth();
  var first = new Date(y,m,1), lastDay = new Date(y,m+1,0).getDate();
  var cells = []; for (var i=0;i<first.getDay();i++) cells.push(null);
  for (var d=1; d<=lastDay; d++) cells.push(new Date(y,m,d));

  var monthlyGrid = '<div class="grid grid-cols-7 border-b border-slate-200 bg-slate-50">' + DOW.map(function(x){return '<div class="px-2 py-2 text-center text-xs font-medium text-slate-500">'+x+'</div>';}).join("") + '</div>'
    + '<div class="grid grid-cols-7">' + cells.map(function(date){
        if (!date) return '<div class="min-h-24 border-b border-r border-slate-100 bg-slate-50 p-1.5"></div>';
        var isToday = iso(date)===iso(TODAY); var ev = eventsOn(date);
        return '<div class="min-h-24 border-b border-r border-slate-100 p-1.5">'
          + '<div class="flex items-center justify-between"><span class="grid h-6 w-6 place-items-center rounded-full text-xs '+(isToday?"bg-blue-600 font-semibold text-white":"text-slate-600")+'">'+date.getDate()+'</span>'
          + '<button class="text-slate-300 hover:text-blue-600" '+act("openNewTask",{date:iso(date)})+'>'+icon("plus","h-3.5 w-3.5")+'</button></div>'
          + '<div class="mt-1 space-y-0.5">' + ev.slice(0,3).map(function(e){return eventBtn(e);}).join("") + (ev.length>3 ? '<p class="px-1 text-xs text-slate-400">+'+(ev.length-3)+' เพิ่มเติม</p>' : '') + '</div></div>';
      }).join("") + '</div>';

  var weekDays = []; for (var i=0;i<7;i++) weekDays.push(addDays(addDays(TODAY,-TODAY.getDay()), i));
  var weeklyGrid = '<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-7">' + weekDays.map(function(d){
      var ev = eventsOn(d);
      return card('<p class="text-xs text-slate-400">'+DOW[d.getDay()]+'</p><p class="text-sm font-semibold text-slate-800">'+fmt(iso(d))+'</p>'
        + '<div class="mt-2 space-y-1">' + (ev.length ? ev.map(function(e){return eventBtn(e,"block w-full truncate rounded px-1.5 py-1 text-left text-xs");}).join("") : '<p class="text-xs text-slate-300">ว่าง</p>') + '</div>'
      , "p-3 "+(iso(d)===iso(TODAY)?"border-blue-400":""));
    }).join("") + '</div>';

  var dailyEv = eventsOn(TODAY);
  var dailyView = card(sectionTitle(thaiDate(TODAY))
    + '<div class="space-y-2">' + (dailyEv.length ? dailyEv.map(function(e){return eventBtn(e,"block w-full rounded-lg px-3 py-2 text-left text-sm");}).join("") : emptyMsg("วันนี้ไม่มีกำหนดการ")) + '</div>', "p-4");

  return '<div class="space-y-4">'
    + '<div class="flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-xl font-semibold text-slate-900">Calendar</h2><p class="text-sm text-slate-500">กำหนดส่งโครงการ งาน Milestone และกิจกรรมทั้งหมด</p></div>'
    + '<div class="flex items-center gap-2"><div class="flex rounded-lg border border-slate-300 p-0.5">' + ["Monthly","Weekly","Daily"].map(function(x){
        return '<button class="rounded-md px-3 py-1 text-xs font-medium '+(UI.calMode===x?"bg-slate-900 text-white":"text-slate-600")+'" '+act("calMode",{mode:x})+'>'+x+'</button>';
      }).join("") + '</div>'
    + (UI.calMode==="Monthly" ? ('<div class="flex items-center gap-1"><button class="rounded-lg border border-slate-300 p-1.5 hover:bg-slate-50" '+act("calPrev")+'>'+icon("chevron-left","h-4 w-4")+'</button>'
        + '<span class="w-32 text-center text-sm font-medium text-slate-800">'+MON[m]+' '+y+'</span>'
        + '<button class="rounded-lg border border-slate-300 p-1.5 hover:bg-slate-50" '+act("calNext")+'>'+icon("chevron-right","h-4 w-4")+'</button></div>') : '')
    + '</div></div>'
    + (UI.calMode==="Monthly" ? card(monthlyGrid,"overflow-hidden") : UI.calMode==="Weekly" ? weeklyGrid : dailyView)
    + '</div>';
}

/* ═══════════════════════════════ Reports ═══════════════════════════════ */
function viewReports(){
  var range = UI.reportRange;
  var RANGES = ["This Week","This Month","Last Month","Quarter","Year","Custom Date"];
  function inRange(s){
    var d = D(s);
    if (range==="This Week") return Math.abs(diffDays(TODAY,d))<=7;
    if (range==="This Month") return d.getMonth()===TODAY.getMonth() && d.getFullYear()===TODAY.getFullYear();
    if (range==="Last Month") return d.getMonth()===TODAY.getMonth()-1 && d.getFullYear()===TODAY.getFullYear();
    if (range==="Quarter") return d.getMonth()>=TODAY.getMonth()-2 && d.getMonth()<=TODAY.getMonth() && d.getFullYear()===TODAY.getFullYear();
    return d.getFullYear()===TODAY.getFullYear();
  }
  var ts = DATA.tasks.filter(function(t){return inRange(t.due);});
  var ps = DATA.projects.filter(function(p){return inRange(p.due);});
  var budget = DATA.projects.reduce(function(s,p){return s+p.budget;},0);
  var used = DATA.projects.reduce(function(s,p){return s+spentOf(p);},0);
  return '<div class="space-y-4">'
    + '<div class="flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-xl font-semibold text-slate-900">Reports</h2><p class="text-sm text-slate-500">ผลการดำเนินงานตามช่วงเวลา</p></div>'
    + '<select class="rounded-lg border border-slate-300 px-3 py-2 text-sm" '+chg("reportRange")+'>' + RANGES.map(function(r){return '<option '+(range===r?"selected":"")+'>'+r+'</option>';}).join("") + '</select></div>'
    + '<div class="grid grid-cols-2 gap-3 lg:grid-cols-4">'
    + stat("Project Completion Rate", pctFn(ps.filter(function(p){return p.status==="COMPLETED";}).length, ps.length)+"%", ps.length+" โครงการในช่วงนี้", "trending-up")
    + stat("Task Completion Rate", pctFn(ts.filter(function(t){return t.status==="COMPLETED";}).length, ts.length)+"%", ts.length+" งาน", "check-square")
    + stat("Overdue Tasks", ts.filter(isOverdue).length, "", "alert-triangle", "text-rose-600","bg-rose-50")
    + stat("Budget Used", pctFn(used,budget)+"%", "฿"+baht(used)+" / ฿"+baht(budget), "wallet")
    + '</div>'
    + '<div class="grid gap-4 lg:grid-cols-2">'
    + card(sectionTitle("Project Performance") + '<div class="space-y-3">' + DATA.projects.map(function(p){
        return '<div><div class="mb-1 flex justify-between text-sm"><span class="truncate pr-2 text-slate-700">'+esc(p.name)+'</span><span class="text-slate-500">'+autoProgress(p)+'%</span></div>'+bar(autoProgress(p), health(p)==="RED"?"bg-rose-500":health(p)==="YELLOW"?"bg-amber-500":"bg-blue-600")+'</div>';
      }).join("") + '</div>', "p-4")
    + card(sectionTitle("Team Performance") + '<div class="space-y-3">' + DATA.users.map(function(u){
        var my = DATA.tasks.filter(function(t){return t.ownerId===u.id;});
        return '<div><div class="mb-1 flex justify-between text-sm"><span class="text-slate-700">'+esc(u.name)+'</span><span class="text-slate-500">'+my.filter(function(t){return t.status==="COMPLETED";}).length+'/'+my.length+'</span></div>'+bar(pctFn(my.filter(function(t){return t.status==="COMPLETED";}).length,my.length),"bg-emerald-500")+'</div>';
      }).join("") + '</div>', "p-4")
    + card(sectionTitle("Budget Report") + '<div class="space-y-3">' + DATA.projects.filter(function(p){return p.budget>0;}).map(function(p){
        var sp = spentOf(p);
        return '<div><div class="mb-1 flex justify-between text-sm"><span class="truncate pr-2 text-slate-700">'+esc(p.name)+'</span><span class="text-slate-500">฿'+baht(sp)+' / ฿'+baht(p.budget)+'</span></div>'+bar(pctFn(sp,p.budget), pctFn(sp,p.budget)>90?"bg-rose-500":"bg-slate-800")+'</div>';
      }).join("") + '</div>', "p-4")
    + card(sectionTitle("Overdue Report") + '<div class="rounded-lg border border-slate-200">' + (DATA.tasks.filter(isOverdue).length ? DATA.tasks.filter(isOverdue).map(function(t){return taskRowHtml(t);}).join("") : emptyMsg("ไม่มีงานเลยกำหนด")) + '</div>', "p-4")
    + '</div></div>';
}

/* ═══════════════════════════════ Management ═══════════════════════════════ */

  var budget = DATA.projects.reduce(function(s,p){return s+p.budget;},0);

  var byCat = CATEGORIES.map(function(c){return [c, DATA.projects.filter(function(p){return p.category===c;}).length];}).filter(function(x){return x[1]>0;});
  var maxCat = Math.max.apply(null, byCat.map(function(x){return x[1];}).concat([1]));

/* ═══════════════════════════════ Search modal ═══════════════════════════════ */
function renderSearchModal(){
  return '<div id="searchModalRoot">' + searchModalInner() + '</div>';
}
function searchModalInner(){
  var q = UI.searchQuery.trim();
  var k = q.toLowerCase();
  var rp = k ? DATA.projects.filter(function(p){ return (p.name+p.id+p.category+p.tags.join(" ")).toLowerCase().indexOf(k)>=0; }) : [];
  var rt = k ? DATA.tasks.filter(function(t){ return (t.name+t.id+t.dept).toLowerCase().indexOf(k)>=0; }) : [];
  var ru = k ? DATA.users.filter(function(u){ return (u.name+u.dept+u.role).toLowerCase().indexOf(k)>=0; }) : [];
  var rc = k ? DATA.tasks.filter(function(t){ return t.comments.some(function(c){return c.text.toLowerCase().indexOf(k)>=0;}); }) : [];
  return modalShell("ค้นหาทั้งระบบ",
    '<input id="searchInputEl" autofocus class="'+inputCls+'" placeholder="ค้นหา Project, Task, คน, Tag หรือ Comment" value="'+esc(q)+'" '+inp("searchInput")+'>'
    + '<div id="searchResultsEl">' + searchResultsHtml(q,k,rp,rt,ru,rc) + '</div>'
  , true, "closeSearch");
}
function searchResultsHtml(q,k,rp,rt,ru,rc){
  if (!k) return '<p class="mt-4 text-sm text-slate-400">พิมพ์เพื่อค้นหา เช่น "test drive", "artwork", "ICE", "seo"</p>';
  var out = '<div class="mt-4 space-y-4">';
  if (rp.length) out += '<div><p class="mb-1 text-xs font-semibold text-slate-500">Projects</p>' + rp.map(function(p){
    return '<button class="block w-full rounded-lg px-2 py-2 text-left text-sm hover:bg-slate-50" '+act("searchGo",{kind:"project",id:p.id})+'>'+esc(p.name)+' <span class="text-xs text-slate-400">· '+p.id+'</span></button>';
  }).join("") + '</div>';
  if (rt.length) out += '<div><p class="mb-1 text-xs font-semibold text-slate-500">Tasks</p>' + rt.slice(0,8).map(function(t){
    return '<button class="block w-full rounded-lg px-2 py-2 text-left text-sm hover:bg-slate-50" '+act("searchGo",{kind:"task",id:t.id})+'>'+esc(t.name)+' <span class="text-xs text-slate-400">· '+esc((projById(t.projectId)||{}).name||"")+'</span></button>';
  }).join("") + '</div>';
  if (ru.length) out += '<div><p class="mb-1 text-xs font-semibold text-slate-500">People</p>' + ru.map(function(u){
    return '<div class="flex items-center gap-2 px-2 py-2 text-sm">'+avatar(u.id)+esc(u.name)+' <span class="text-xs text-slate-400">· '+esc(u.role)+'</span></div>';
  }).join("") + '</div>';
  if (rc.length) out += '<div><p class="mb-1 text-xs font-semibold text-slate-500">Comments</p>' + rc.map(function(t){
    return '<button class="block w-full rounded-lg px-2 py-2 text-left text-sm hover:bg-slate-50" '+act("searchGo",{kind:"task",id:t.id})+'>ใน '+esc(t.name)+'</button>';
  }).join("") + '</div>';
  if (!rp.length && !rt.length && !ru.length && !rc.length) out += '<p class="text-sm text-slate-400">ไม่พบผลลัพธ์สำหรับ "'+esc(q)+'" ลองใช้คำที่สั้นลง</p>';
  return out + '</div>';
}

    + field("Owner", selectHtml(DATA.users, t.ownerId, "patchTask", {field:"ownerId"}))
    + field("Department", selectHtml(DEPARTMENTS, t.dept, "patchTask", {field:"dept"}))
    + field("Start Date", '<input type="date" class="'+inputCls+'" value="'+t.start+'" '+chg("patchTask",{field:"start"})+'>')
    + field("Due Date", '<input type="date" class="'+inputCls+'" value="'+t.due+'" '+chg("patchTask",{field:"due"})+'>')
    + field("Estimated Cost (฿)", '<input type="number" class="'+inputCls+'" value="'+t.estCost+'" '+chg("patchTask",{field:"estCost"})+'>')
    + field("Actual Cost (฿)", '<input type="number" class="'+inputCls+'" value="'+t.actualCost+'" '+chg("patchTask",{field:"actualCost"})+'>')
    + '</div>'
    + '<div><div class="mb-1 flex items-center justify-between text-xs font-medium text-slate-600"><span>Progress</span><span>'+t.progress+'%</span></div>'
    + '<input type="range" min="0" max="100" step="5" value="'+t.progress+'" class="w-full accent-blue-600" '+chg("patchTask",{field:"progress"})+'></div>'
    + field("Description", '<textarea rows="3" class="'+inputCls+'" placeholder="รายละเอียดงาน" '+chg("patchTask",{field:"desc"})+'>'+esc(t.desc||"")+'</textarea>')
    + '<div>' + sectionTitle("Subtask", '<span class="text-xs text-slate-500">'+done+' / '+t.subtasks.length+' Completed · '+pctFn(done,t.subtasks.length)+'%</span>')
    + '<div class="rounded-lg border border-slate-200">' + t.subtasks.map(function(s){
        return '<div class="flex items-center gap-2 border-b border-slate-100 px-3 py-2 last:border-0">'
          + '<input type="checkbox" class="h-4 w-4 accent-emerald-600" '+(s.done?"checked":"")+' '+chg("toggleSubtask",{tid:t.id,sid:s.id})+'>'
          + '<span class="flex-1 text-sm '+(s.done?"text-slate-400 line-through":"text-slate-700")+'">'+esc(s.name)+'</span>'
          + '<button class="rounded p-1 text-slate-300 hover:bg-rose-50 hover:text-rose-600" '+act("deleteSubtask",{tid:t.id,sid:s.id})+'>'+icon("x","h-3.5 w-3.5")+'</button></div>';
      }).join("")
    + '<div class="px-3 py-2"><input placeholder="+ เพิ่ม Subtask แล้วกด Enter" class="w-full text-sm text-slate-700 placeholder-slate-400 focus:outline-none" '+kd("addSubtask",{tid:t.id})+'></div></div></div>'
    + '<div>' + sectionTitle("Comment")
    + '<div class="space-y-3">' + (t.comments.length ? t.comments.map(function(c){
        var u = userById(c.userId);
        return '<div class="flex gap-2">'+avatar(c.userId,"md")+'<div class="min-w-0 flex-1 rounded-lg bg-slate-50 px-3 py-2"><p class="text-xs text-slate-500">'+esc(u.name)+' · '+esc(c.at)+'</p>'
          + '<p class="text-sm text-slate-800">'+esc(c.text).replace(/@(\w+)/g,'<span class="font-medium text-blue-600">@$1</span>')+'</p></div></div>';
      }).join("") : emptyMsg("ยังไม่มีความเห็น เริ่มพูดคุยกับทีมได้เลย")) + '</div>'
    + '<div class="mt-3 flex gap-2"><input class="'+inputCls+'" placeholder="เขียนคอมเมนต์ ใช้ @ เพื่อ mention เช่น @ICE" value="'+esc(UI.commentDraft)+'" '+inp("commentInput")+' '+kd("commentKeydown")+'>'
    + '<button class="rounded-lg bg-blue-600 px-3 py-2 text-sm font-medium text-white hover:bg-blue-700" '+act("sendComment")+'>ส่ง</button></div></div>'
    + '</div>'
    + '<div class="flex items-center justify-between gap-2 border-t border-slate-200 px-5 py-3">'
    + '<button class="flex items-center gap-1.5 rounded-lg border border-rose-200 px-3 py-2 text-sm font-medium text-rose-600 hover:bg-rose-50" '+act("askDeleteTask",{id:t.id})+'>'+icon("trash-2","h-4 w-4")+'ลบ Task นี้</button>'
    + '<button class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800" '+act("closeDrawer")+'>เสร็จสิ้น</button></div>'
    + '</div></div>';
}
</script>
