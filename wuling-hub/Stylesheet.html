<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Baloo+2:wght@600;700&display=swap');

:root {
  --color-bg: #f5ead8;
  --color-surface: #ebddc5;
  --color-text: #201e1d;
  --color-accent: #c67139;
  --color-accent-2: #7a8a5e;
  --color-divider: rgba(32,30,29,0.16);

  --color-neutral-100: #f9f4ed;
  --color-neutral-200: #eee7db;
  --color-neutral-300: #dcd3c4;
  --color-neutral-400: #c0b6a5;
  --color-neutral-500: #a19786;
  --color-neutral-600: #82796a;
  --color-neutral-700: #645c50;
  --color-neutral-800: #474238;
  --color-neutral-900: #2e2b25;

  --color-accent-100: #fff2eb;
  --color-accent-200: #ffe1d0;
  --color-accent-300: #ffc6a5;
  --color-accent-400: #f6a06b;
  --color-accent-500: #d67f48;
  --color-accent-600: #b2622d;
  --color-accent-700: #8c491a;
  --color-accent-800: #643312;
  --color-accent-900: #402310;

  --color-accent-2-100: #f0fae1;
  --color-accent-2-200: #e1eecc;
  --color-accent-2-300: #ccdbb2;
  --color-accent-2-400: #aebf92;
  --color-accent-2-500: #8fa073;
  --color-accent-2-600: #728157;
  --color-accent-2-700: #56633f;
  --color-accent-2-800: #3d472b;
  --color-accent-2-900: #272e1b;

  --font-heading: "Baloo 2", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, sans-serif;

  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;

  --shadow-sm: 0 1px 2px rgba(46,43,37,0.14);
  --shadow-md: 0 3px 10px rgba(46,43,37,0.16);
  --shadow-lg: 0 12px 32px rgba(46,43,37,0.22);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
h1,h2,h3,h4,h5,h6 { font-family: var(--font-heading); font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
h2 { font-size: 26px; } h3 { font-size: 20px; } h4 { font-size: 17px; } h5 { font-size: 15px; }
p { margin: 0 0 10px; }
a { color: var(--color-accent); }
button { font-family: inherit; }

#app { display: flex; min-height: 100vh; }

/* sidebar */
.sidebar { width: 226px; flex: none; background: var(--color-surface); padding: 18px 12px; display: flex; flex-direction: column; gap: 3px; position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--color-divider); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.brand-mark { width: 34px; height: 34px; border-radius: 50%; background: var(--color-accent); color: var(--color-bg); display: grid; place-items: center; font-family: var(--font-heading); font-size: 16px; flex: none; }
.brand-name { margin: 0; font-size: 15px; }
.brand-sub { margin: 0; font-size: 10.5px; opacity: 0.6; }
.navbtn { display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: transparent; text-align: left; padding: 9px 10px; border-radius: 12px; cursor: pointer; font-size: 13.5px; color: var(--color-text); font-family: var(--font-body); }
.navbtn:hover { background: rgba(32,30,29,0.06); }
.navbtn.active { background: var(--color-accent); color: var(--color-bg); }
.navbtn .ic { width: 16px; height: 16px; flex: none; }
.sidebar-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--color-divider); }
.me-chip { display: flex; align-items: center; gap: 8px; width: 100%; border: none; background: transparent; padding: 6px 8px; border-radius: 12px; cursor: pointer; text-align: left; }
.me-chip:hover { background: rgba(32,30,29,0.06); }
.me-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--color-accent-2); color: var(--color-bg); display: grid; place-items: center; font-size: 10.5px; font-weight: 700; flex: none; }
.me-name { display: block; font-size: 12.5px; }
.me-role { display: block; font-size: 10px; opacity: 0.6; }

/* main column */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 22px; border-bottom: 1px solid var(--color-divider); background: var(--color-bg); position: sticky; top: 0; z-index: 20; }
.search-wrap { position: relative; flex: 1; max-width: 340px; }
.search-wrap .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: 0.5; width: 15px; height: 15px; }
.content { flex: 1; padding: 20px 22px 60px; min-width: 0; }

/* generic */
.input, select.input, textarea.input { width: 100%; min-height: 34px; padding: 6px 12px; font: inherit; font-size: 13.5px; color: var(--color-text); background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 999px; }
.search-wrap .input { padding-left: 32px; }
textarea.input { border-radius: var(--radius-md); min-height: 76px; resize: vertical; }
.input:focus { outline: 2px solid var(--color-accent); outline-offset: 0; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.field label { font-size: 11.5px; opacity: 0.7; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-family: var(--font-heading); font-weight: 600; font-size: 13px; border: 1px solid transparent; padding: 8px 16px; border-radius: 999px; background: transparent; color: var(--color-text); }
.btn .ic { width: 14px; height: 14px; }
.btn-primary { background: var(--color-accent); color: #fff; }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-secondary { border-color: var(--color-divider); background: transparent; }
.btn-secondary:hover { background: rgba(32,30,29,0.06); }
.btn-danger { background: var(--color-accent-700); color: #fff; }
.btn-ghost { color: var(--color-accent); padding-inline: 6px; }
.btn-ghost:hover { background: rgba(198,113,57,0.1); }
.btn-icon { width: 32px; height: 32px; padding: 0; border-radius: 50%; position: relative; }
.card { background: var(--color-surface); border-radius: var(--radius-lg); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.elev { box-shadow: var(--shadow-sm); }
.kicker { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent); }
.tag { display: inline-flex; align-items: center; font-size: 10.5px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent-700); }
.hr { height: 1px; background: var(--color-divider); border: 0; margin: 12px 0; }
.grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fit,minmax(170px,1fr)); gap: 10px; }
.stat-value { font-family: var(--font-heading); font-size: 26px; font-weight: 700; }
.stat-sub { font-size: 11px; opacity: 0.6; }
.progress-track { height: 6px; background: var(--color-neutral-200); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-btn { display: block; width: 100%; text-align: left; border: none; background: transparent; cursor: pointer; padding: 6px 0; font-family: var(--font-body); color: inherit; }
.avatar { border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.avatar-sm { width: 24px; height: 24px; font-size: 10px; }
.avatar-md { width: 34px; height: 34px; font-size: 12px; }
.avatar-lg { width: 48px; height: 48px; font-size: 15px; }

/* table-ish task row */
.task-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--color-divider); background: var(--color-bg); }
.task-row:last-child { border-bottom: none; }
.task-check { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--color-divider); flex: none; cursor: pointer; display: grid; place-items: center; color: #fff; font-size: 11px; }
.task-order { display: flex; flex-direction: column; gap: 0; }
.task-order button { border: none; background: transparent; cursor: pointer; opacity: 0.5; padding: 0 2px; }
.task-order button:hover { opacity: 1; }
.task-bar-mini { width: 60px; flex: none; }

/* modal / dialog */
.overlay { position: fixed; inset: 0; background: rgba(46,43,37,0.5); display: grid; place-items: center; padding: 16px; z-index: 100; }
.dialog { width: min(460px,100%); max-height: 90vh; overflow-y: auto; background: var(--color-surface); border-radius: 24px; padding: 18px; box-shadow: var(--shadow-lg); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.popover { position: absolute; background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 8px; z-index: 30; }

/* drawer */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(46,43,37,0.35); z-index: 90; }
.drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(420px,100%); background: var(--color-bg); box-shadow: var(--shadow-lg); z-index: 95; overflow-y: auto; padding: 18px; }

/* kanban */
.kanban-cols { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; }
.kanban-col { width: 250px; flex: none; background: var(--color-surface); border-radius: var(--radius-lg); padding: 10px; }
.kanban-card { background: var(--color-bg); border-radius: 14px; padding: 8px 10px; margin-bottom: 8px; cursor: grab; box-shadow: var(--shadow-sm); }

/* calendar */
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
.cal-cell { min-height: 76px; border-radius: 10px; padding: 4px; font-size: 11px; background: var(--color-surface); }
.cal-dow { text-align: center; font-size: 11px; opacity: 0.6; padding: 4px 0; }

/* gantt */
.gantt-row { display: grid; grid-template-columns: 220px 1fr; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--color-divider); }
.gantt-track { position: relative; height: 18px; background: var(--color-neutral-200); border-radius: 6px; }
.gantt-bar { position: absolute; top: 0; height: 100%; border-radius: 6px; }

/* table */
table.simple { width: 100%; border-collapse: collapse; font-size: 13px; }
table.simple th { text-align: left; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.6; padding: 6px 8px; border-bottom: 1px solid var(--color-divider); }
table.simple td { padding: 7px 8px; border-bottom: 1px solid rgba(32,30,29,0.08); }

.hidden { display: none !important; }
.muted { opacity: 0.6; }
.flex { display: flex; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.gap-8 { gap: 8px; }
.wrap { flex-wrap: wrap; }

@media (max-width: 760px) {
  .sidebar { position: fixed; z-index: 50; left: -240px; transition: left 0.2s; }
  .sidebar.open { left: 0; }
  .content { padding: 14px; }
}
</style>
